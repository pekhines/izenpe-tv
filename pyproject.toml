[project]
name = "izenpe-tv"
version = "0.1.0"
description = "Unofficial Linux client for Izenpe's cloud Tarjeta Virtual certificates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "cryptography>=40",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]

[project.scripts]
izenpe-tv = "izenpe_tv.cli:main"
izenpe-tv-agent = "izenpe_tv.agent:main"
izenpe-tv-callback = "izenpe_tv.callback:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
